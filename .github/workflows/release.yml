name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: The tag and pyproject.toml must agree
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag $GITHUB_REF_NAME -> $tagged, pyproject.toml says $declared"
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version = \"$declared\" in pyproject.toml"
            exit 1
          fi
          echo "VERSION=$tagged" >> "$GITHUB_ENV"

      - name: The pack compiles
        run: python -m compileall -q __init__.py nodes

      - name: The node table and the localization add up
        run: |
          python - <<'PY'
          import ast
          import json
          import pathlib

          PREFIX = "darkil"

          root = pathlib.Path(".")
          tree = ast.parse(root.joinpath("__init__.py").read_text("utf-8"))

          def assigned(name):
              for node in tree.body:
                  if isinstance(node, ast.Assign) and any(
                      isinstance(t, ast.Name) and t.id == name for t in node.targets
                  ):
                      return node.value
              raise AssertionError(f"{name} is not assigned in __init__.py")

          def registered(name):
              value = assigned(name)
              assert isinstance(value, ast.Dict), f"{name} is not a dict literal"
              classes = []
              for key in value.keys:
                  assert isinstance(key, ast.Call) and key.args, f"{name}: a key is not as_node_name(Class)"
                  arg = key.args[0]
                  assert isinstance(arg, ast.Name), f"{name}: a key is not as_node_name(Class)"
                  classes.append(arg.id)
              return classes

          classes = registered("NODE_CLASS_MAPPINGS")
          named = registered("NODE_DISPLAY_NAME_MAPPINGS")

          assert classes, "NODE_CLASS_MAPPINGS is empty"

          twice = sorted({c for c in classes if classes.count(c) > 1})
          assert not twice, f"registered twice: {twice}"

          unnamed = sorted(set(classes) - set(named))
          assert not unnamed, f"no display name for {unnamed}"

          orphans = sorted(set(named) - set(classes))
          assert not orphans, f"display name without a node: {orphans}"

          imported = {
              alias.asname or alias.name
              for node in ast.walk(tree)
              if isinstance(node, (ast.Import, ast.ImportFrom))
              for alias in node.names
          }
          missing = sorted(set(classes) - imported)
          assert not missing, f"registered but never imported: {missing}"

          web = assigned("WEB_DIRECTORY")
          assert isinstance(web, ast.Constant), "WEB_DIRECTORY is not a plain string"
          web_dir = root / web.value
          assert web_dir.is_dir(), f"WEB_DIRECTORY {web.value} does not exist"
          scripts = sorted(p.name for p in web_dir.glob("*.js"))
          assert scripts, f"no .js file in {web.value}"

          renamed = {}
          for path in sorted(root.joinpath("nodes").rglob("*.py")):
              module = ast.parse(path.read_text("utf-8"))
              for node in ast.walk(module):
                  if not isinstance(node, ast.ClassDef):
                      continue
                  for stmt in node.body:
                      if (
                          isinstance(stmt, ast.Assign)
                          and any(isinstance(t, ast.Name) and t.id == "DEFAULT_NODE_NAME" for t in stmt.targets)
                          and isinstance(stmt.value, ast.Constant)
                      ):
                          renamed[node.name] = stmt.value.value

          node_names = {PREFIX + renamed.get(c, c) for c in classes}

          locale = root / "locales" / "ru" / "nodeDefs.json"
          described = json.loads(locale.read_text("utf-8"))
          assert isinstance(described, dict) and described, f"{locale} is empty"

          stale = sorted(set(described) - node_names)
          assert not stale, f"{locale} describes nodes that are not registered: {stale}"

          untranslated = sorted(node_names - set(described))

          print(f"{len(classes)} nodes:", ", ".join(sorted(node_names)))
          print(f"{len(scripts)} web scripts:", ", ".join(scripts))
          print(f"Russian entries: {len(node_names) - len(untranslated)} of {len(node_names)}")
          if untranslated:
              print("::warning::no Russian entry for " + ", ".join(untranslated))
          PY

      - name: Release notes out of the changelogs
        run: |
          section() {
            awk -v v="$VERSION" '
              index($0, "## " v " ") == 1 || $0 == "## " v {f=1; next}
              f && /^## / {exit}
              f {print}
            ' "$1"
          }
          section CHANGELOG.md > /tmp/en.md
          section CHANGELOG_RU.md > /tmp/ru.md
          if [ ! -s /tmp/en.md ] || [ ! -s /tmp/ru.md ]; then
            echo "::error::no section for $VERSION in CHANGELOG.md or CHANGELOG_RU.md"
            exit 1
          fi
          { cat /tmp/en.md; echo; echo "---"; echo; cat /tmp/ru.md; } > /tmp/notes.md
          cat /tmp/notes.md

      - name: Pack the archive
        run: |
          name="comfyui-darkil-nodes"
          mkdir -p dist
          git archive --format=zip --prefix="$name/" -o "dist/$name-$VERSION.zip" "$GITHUB_REF_NAME"
          unzip -l "dist/$name-$VERSION.zip"
          echo "ARCHIVE=dist/$name-$VERSION.zip" >> "$GITHUB_ENV"
          echo "PREFIX=$name" >> "$GITHUB_ENV"

      - name: What is in the archive, and what is not
        run: |
          listed=$(unzip -Z1 "$ARCHIVE")
          echo "$listed"
          for bad in "\.venv/" "dev-junction" "comfyui-path\.txt" "\.mcp\.json" \
                     "__pycache__" "\.github/" "\.gitignore" "\.gitattributes"; do
            if echo "$listed" | grep -qE -- "$bad"; then
              echo "::error::$ARCHIVE contains something matching $bad"
              exit 1
            fi
          done
          for needed in __init__.py nodes/global_utils.py nodes/logic/show_any.py \
                        nodes/conditioning/THIRD_PARTY_LICENSES.txt \
                        web/js/show_any.js web/js/LICENSE.GPL-3.0.txt \
                        locales/ru/nodeDefs.json pyproject.toml requirements.txt \
                        README.md README_RU.MD CHANGELOG.md CHANGELOG_RU.md LICENSE; do
            echo "$listed" | grep -qxF "$PREFIX/$needed" || {
              echo "::error::$needed is missing from $ARCHIVE"
              exit 1
            }
          done
          echo "checked: the nodes, the web extension, the localization and the licenses are in, the local state is not"

      - name: The localization in the archive still parses
        run: |
          unzip -p "$ARCHIVE" "$PREFIX/locales/ru/nodeDefs.json" > /tmp/nodeDefs.json
          python -c "import json; json.load(open('/tmp/nodeDefs.json', encoding='utf-8')); print('nodeDefs.json parses')"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" \
            --title "ComfyUI-darkil-nodes $VERSION" \
            --notes-file /tmp/notes.md \
            --verify-tag
